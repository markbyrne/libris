# libris configuration
# Copy to config.local.yaml and adjust paths before running.
# All paths support ~ expansion.
# Environment variable overrides: LIBRIS_<SECTION>_<KEY> (e.g. LIBRIS_CALIBRE_MODE=docker)

watcher:
  # Directory to watch for new books/audiobooks
  incoming_dir: ~/books/incoming
  # How often fswatch checks for changes (macOS only, seconds)
  poll_interval_seconds: 2
  # How often to re-scan incoming_dir for files that arrived while the
  # daemon was offline. Also runs once at startup. Set to 0 to disable.
  scan_interval_hours: 1

paths:
  # Intermediate staging area for converted files
  staging_dir: ~/books/staging
  # Quarantine for low-confidence metadata matches — review before importing
  review_dir: ~/books/review
  # Files that failed processing (errors)
  failed_dir: ~/books/failed
  # SQLite state database
  state_db: ~/books/libris.db

calibre:
  # "local" = use system calibredb directly
  # "docker" = run calibredb inside a Docker container (e.g. a calibre-web container)
  mode: local

  # --- local mode ---
  # Directory containing metadata.db (the Calibre library root).
  # (The legacy key `library_path` is still accepted as an alias.)
  library_db_path: ~/Calibre Library

  # Optional: where physical book files live, if you use calibre-web's
  # "Separate Book Files from Library" feature. Defaults to library_db_path.
  # book_file_path: ~/Calibre Book Files

  # --- calibre-web coexistence (recommended if calibre-web shares this library) ---
  # Ping calibre-web's /reconnect endpoint after every import/removal so it
  # reopens its DB connection instead of going stale (prevents "database disk
  # image is malformed").  Requires calibre-web started with the -r flag.
  # reconnect_url: http://192.168.1.10:8083/reconnect

  # --- docker mode (uncomment and fill in if using a container) ---
  # docker_container: calibre-web
  # path_map:
  #   # Maps host paths to container-internal paths
  #   # Longest prefix wins
  #   /media/pidrive/Books: /books
  #   /media/pidrive/completed/books: /add

metadata:
  # Confidence threshold: 0.0–1.0
  # Files matched above this score are auto-imported.
  # Files below are moved to review/ and you are notified.
  confidence_threshold: 0.75

  # Optional Google Books API key (unauthenticated = ~60 req/min)
  google_books_api_key: null

  # Always overwrite embedded metadata with API results (recommended: true)
  overwrite_existing: true

  # mock_mode: true disables all HTTP calls and returns empty results.
  # Useful for testing the pipeline without hitting real APIs.
  mock_mode: false

  # What to do when an incoming book already exists in the Calibre library:
  #   review — move the duplicate to review/ for a manual decision (default)
  #   skip   — discard the incoming duplicate
  #   import — import it anyway (Calibre keeps both)
  duplicate_action: review

output:
  # Preferred ebook format for import: epub | mobi
  preferred_ebook_format: epub

  # Preferred audiobook format: m4b
  preferred_audio_format: m4b

  # Embed the matched cover art inside the audio file itself (album art).
  # The matched cover is ALWAYS saved as cover.jpg in the book's library
  # directory regardless of this setting — this controls only the in-file art.
  embed_cover_art: true

  # Controls how ebooks that are not in the preferred format are handled:
  #   preferred — convert to preferred_ebook_format, import the converted
  #               file only, and delete the original source file afterwards
  #   all       — import the file in whatever format it arrived; no
  #               conversion is performed and Calibre stores the native format
  ebook_format_policy: preferred

ntfy:
  # ntfy.sh topic name (required for notifications)
  topic: my-libris
  # ntfy server URL (default: public ntfy.sh)
  base_url: https://ntfy.sh
  # Set to false to disable all notifications
  enabled: true
  # Optional Bearer token for private ntfy channels
  # auth_token: your_token_here

multipart:
  # Multi-part audiobooks: after this many hours with an incomplete set of
  # parts, escalate them to review/ so you can force-combine or keep waiting.
  timeout_hours: 48

api:
  # Directive API — lets an external tool (e.g. Librarr) pre-register a
  # metadata match for an incoming file so the pipeline skips its own lookups.
  # Fail-closed: BOTH enabled: true AND a non-empty api_key are required.
  enabled: false
  api_key: ""

log_level: INFO   # DEBUG | INFO | WARNING | ERROR
