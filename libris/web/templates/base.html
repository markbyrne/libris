<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Libris{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <style>
    body { font-size: 14px; }
    .nav-link {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.375rem 0.625rem; border-radius: 0.375rem;
      color: #4b5563; text-decoration: none; margin-bottom: 0.125rem;
      transition: background 0.1s;
    }
    .nav-link:hover { background: #f3f4f6; }
    .nav-link.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .badge {
      margin-left: auto; min-width: 1.25rem; height: 1.25rem;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 9999px; font-size: 0.65rem; font-weight: 700; padding: 0 0.3rem;
    }
    .badge-red   { background: #ef4444; color: #fff; }
    .badge-amber { background: #f59e0b; color: #fff; }
    .badge-blue  { background: #3b82f6; color: #fff; }
    .conf-bar { display: inline-block; width: 48px; height: 5px; background: #e5e7eb; border-radius: 2px; vertical-align: middle; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 2px; }
    .conf-hi { background: #22c55e; }
    .conf-md { background: #f59e0b; }
    .conf-lo { background: #ef4444; }
    .tag { display: inline-flex; align-items: center; padding: 0.1rem 0.4rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; }
    .tag-ebook { background: #dbeafe; color: #1d4ed8; }
    .tag-audio { background: #fce7f3; color: #9d174d; }
    .tag-dup   { background: #fef3c7; color: #78350f; }
    .btn { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.3rem 0.7rem; border-radius: 0.375rem; font-size: 0.8rem; font-weight: 500; border: 1px solid; cursor: pointer; text-decoration: none; }
    .btn-primary  { background: #2563eb; color: #fff; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost    { background: #fff; color: #374151; border-color: #d1d5db; }
    .btn-ghost:hover { background: #f9fafb; }
    .btn-green    { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn-green:hover { background: #15803d; }
    .btn-danger   { background: #fff; color: #dc2626; border-color: #fca5a5; }
    .btn-danger:hover { background: #fef2f2; }
    .btn-amber    { background: #fff; color: #92400e; border-color: #fcd34d; }
    .btn-amber:hover { background: #fffbeb; }
    .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }
    table.queue th { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    table.queue td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    table.queue tbody tr:last-child td { border-bottom: none; }
    table.queue tbody tr:hover { background: #f9fafb; }
    .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1rem; }
    .alert-red  { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
    .alert-amber { background: #fffbeb; color: #78350f; border: 1px solid #fcd34d; }
    .alert-green { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
    button.htmx-request { opacity: 0.45; cursor: wait; pointer-events: none; }
    tr.htmx-swapping { opacity: 0; transition: opacity 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="flex" style="min-height:100vh">

  <!-- Sidebar nav -->
  <aside class="w-48 bg-white border-r border-gray-200 flex flex-col" style="min-height:100vh; position:sticky; top:0; height:100vh; overflow-y:auto;">
    <div class="p-4 border-b border-gray-100">
      <div class="font-bold text-base">📚 Libris</div>
    </div>
    <nav class="p-2 flex-1 pt-3">
      <a href="/config" class="nav-link {{ 'active' if active_page == 'config' else '' }}">
        <span>⚙️</span> Config
      </a>
      <a href="/review" class="nav-link {{ 'active' if active_page == 'review' else '' }}">
        <span>🔍</span> Review
        {% if counts.review %}<span class="badge badge-red">{{ counts.review }}</span>{% endif %}
      </a>
      <a href="/failed" class="nav-link {{ 'active' if active_page == 'failed' else '' }}">
        <span>❌</span> Failed
        {% if counts.failed %}<span class="badge badge-red">{{ counts.failed }}</span>{% endif %}
      </a>
      <a href="/pending" class="nav-link {{ 'active' if active_page == 'pending' else '' }}">
        <span>⏳</span> Pending
        {% if counts.pending %}<span class="badge badge-amber">{{ counts.pending }}</span>{% endif %}
      </a>
    </nav>
    <div class="p-3 border-t border-gray-100">
      <div class="text-xs text-gray-400 truncate" title="{{ config_file }}">{{ config_file }}</div>
    </div>
  </aside>

  <!-- Page content -->
  <main class="flex-1 p-6 overflow-auto">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
