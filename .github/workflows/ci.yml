name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ffmpeg/ffprobe enable the real-ffmpeg integration tests
      # (they self-skip when the binaries are absent)
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        # web extra included so the directive-API tests run in CI (they
        # importorskip fastapi otherwise).
        run: pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -q
