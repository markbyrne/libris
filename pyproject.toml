[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylibris"
version = "0.3.11b0"
description = "Intelligent book and audiobook organiser for self-hosted Calibre libraries"
authors = [{ name = "Mark Byrne" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["calibre", "ebooks", "audiobooks", "self-hosted", "library"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",        # ntfy + API calls (sync client)
    "pyyaml>=6.0",        # config parsing
    "rapidfuzz>=3.0",     # fuzzy title matching in scorer
    "click>=8.0",         # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
libris = "libris.cli:main"

[project.urls]
Homepage = "https://github.com/markbyrne/libris"
Repository = "https://github.com/markbyrne/libris"
Issues = "https://github.com/markbyrne/libris/issues"
Changelog = "https://github.com/markbyrne/libris/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["libris*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length — long URLs/regexes allowed
    "SIM105",  # try/except/pass is clearer than contextlib.suppress at these call sites
    "SIM117",  # nested `with patch(...)` blocks are idiomatic in the test suite
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and calibredb in PATH",
    "live: requires network access to Google Books / OpenLibrary",
]
